<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil Sonata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1c1916; --ink:#f3ead8; --muted:#a89c88; --accent:#f2c230; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100vh; padding:24px 16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 30%, #2d2822, var(--bg)) fixed, var(--bg);
    color:var(--ink); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header, .stage, .bar, .controls { width:min(1100px, 100%); }
  header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 16px; margin-bottom:12px; }
  h1 { font-family:Caveat,cursive; font-weight:700; font-size:42px; margin:0; line-height:1; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .stage { position:relative; aspect-ratio:16/9; border-radius:6px; overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.05); background:#f5eedf; }
  canvas { display:block; width:100%; height:100%; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; border:0; padding:0; margin:0;
    background:transparent; cursor:pointer; transition:opacity .5s; }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .big { display:flex; flex-direction:column; align-items:center; gap:12px; color:#3a332c;
    font-family:Caveat,cursive; font-size:clamp(20px, 3.4vw, 32px); }
  .disc { width:clamp(56px, 9vw, 88px); aspect-ratio:1; border-radius:50%; background:#2f2a25;
    display:grid; place-items:center; box-shadow:0 12px 30px rgba(0,0,0,.25); transition:transform .2s; }
  .overlay:hover .disc { transform:scale(1.07); }
  .bar { height:3px; background:rgba(255,255,255,.08); border-radius:3px; margin-top:14px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; }
  .ctl { appearance:none; border:1px solid rgba(243,234,216,.18); background:rgba(243,234,216,.06);
    color:var(--ink); padding:9px 16px; border-radius:999px; font:inherit; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
  .ctl:hover { background:rgba(243,234,216,.13); }
  .ctl:disabled { opacity:.4; cursor:default; }
  .ctl.save { background:var(--accent); color:#1c1916; border-color:transparent; font-weight:600; }
  .ctl[hidden] { display:none; }
  .dot { width:9px; height:9px; border-radius:50%; background:#e5534b; }
  .recording .dot { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .status { margin-left:auto; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <header>
    <h1>Pencil Sonata</h1>
    <p>A drawing that plays itself: the pencil's height picks the notes.</p>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="overlay" id="overlay" aria-label="Start the drawing">
      <span class="big">
        <span class="disc"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#f3ead8"/></svg></span>
        tap to draw · sound on
      </span>
    </button>
  </div>
  <div class="bar"><i id="progress"></i></div>

  <div class="controls">
    <button class="ctl" id="play">▶ Play</button>
    <button class="ctl" id="restart">↺ Restart</button>
    <button class="ctl" id="rec"><span class="dot"></span> Record video</button>
    <a class="ctl save" id="save" hidden>⬇ Save video</a>
    <span class="status" id="status">Space = play / pause</span>
  </div>

<script>
// ---------- setup ----------
const W = 1280, H = 720, S = 1.5;               // logical size, pixel scale (1920×1080 output)
const cv = document.getElementById('cv');
cv.width = W * S; cv.height = H * S;
const g = cv.getContext('2d');

function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(20260924);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const easeIO = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const smooth = u => (1 - Math.cos(Math.PI * u)) / 2;
const prog = u => 0.7 * u + 0.3 * smooth(u);

// ---------- scene ----------
const circle = (cx, cy, r) => `M ${cx + r} ${cy} A ${r} ${r} 0 1 1 ${cx - r} ${cy} A ${r} ${r} 0 1 1 ${cx + r} ${cy}`;
function bumpy(cx, cy, rx, ry, n, b = 1.3, rot = -Math.PI / 2) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = rot + i / n * Math.PI * 2, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    if (!i) d += `M ${x} ${y}`;
    else { const m = a - Math.PI / n; d += ` Q ${cx + rx * b * Math.cos(m)} ${cy + ry * b * Math.sin(m)} ${x} ${y}`; }
  }
  return d;
}
let rays = '';
for (let j = 0; j < 12; j++) {
  const a = j / 12 * Math.PI * 2 + .13, r1 = 76, r2 = j % 2 ? 98 : 110;
  rays += `M ${1060 + r1 * Math.cos(a)} ${140 + r1 * Math.sin(a)} L ${1060 + r2 * Math.cos(a)} ${140 + r2 * Math.sin(a)} `;
}
let tufts = '';
for (const [x, y] of [[60, 640], [262, 700], [600, 684], [705, 650], [935, 702], [1225, 628]])
  tufts += `M ${x} ${y} L ${x + 4} ${y - 16} L ${x + 7} ${y} L ${x + 12} ${y - 22} L ${x + 15} ${y} L ${x + 20} ${y - 14} L ${x + 22} ${y} `;
const win = x => ({ d: `M ${x} 420 L ${x + 35} 420 L ${x + 35} 456 L ${x} 456 Z M ${x + 17.5} 420 L ${x + 17.5} 456 M ${x} 438 L ${x + 35} 438`,
  fill: `M ${x} 420 L ${x + 35} 420 L ${x + 35} 456 L ${x} 456 Z`, color: '#f7df8e' });
const flower = (x, y, c) => [
  { d: `M ${x} ${y} Q ${x - 5} ${y - 22} ${x + 1} ${y - 40} M ${x - 1} ${y - 16} Q ${x - 16} ${y - 20} ${x - 19} ${y - 31} Q ${x - 7} ${y - 28} ${x - 1} ${y - 16}`,
    fill: `M ${x - 1} ${y - 16} Q ${x - 16} ${y - 20} ${x - 19} ${y - 31} Q ${x - 7} ${y - 28} ${x - 1} ${y - 16} Z`, color: '#5f9446', fast: 1.3 },
  { d: bumpy(x + 1, y - 50, 10, 10, 5, 1.75), color: c, fast: 1.3 },
];

// Drawing order is also paint order (each item: watercolor fill, then pencil line).
const ITEMS = [
  { d: 'M 0 455 C 150 395, 300 400, 440 440 S 720 380, 880 420 S 1130 450, 1280 405', closeFill: true, color: '#a9c7b4' },
  { d: 'M 0 548 C 180 500, 360 515, 560 552 S 930 612, 1280 530', closeFill: true, color: '#9cc978' },
  { d: 'M 360 545 L 360 402 L 540 402 L 540 545 Z', color: '#f0d6ae' },
  { d: 'M 338 406 L 450 310 L 562 406 Z', color: '#cf6a55' },
  { d: 'M 500 353 L 500 300 L 525 300 L 525 375 M 496 300 L 496 292 L 529 292 L 529 300 Z',
    fill: 'M 500 353 L 500 300 L 525 300 L 525 375 Z M 496 300 L 496 292 L 529 292 L 529 300 Z', color: '#9d6149' },
  { d: 'M 425 545 L 425 482 Q 450 460 475 482 L 475 545 ' + circle(465, 515, 2.5),
    fill: 'M 425 545 L 425 482 Q 450 460 475 482 L 475 545 Z', color: '#86573d' },
  win(378), win(487),
  { d: 'M 512 288 C 494 268, 530 254, 514 234 S 494 198, 520 180 S 548 148, 528 120' },
  { d: 'M 432 545 C 422 600, 362 640, 330 720 M 468 545 C 478 600, 468 650, 482 720',
    fill: 'M 432 545 C 422 600 362 640 330 720 L 482 720 C 468 650 478 600 468 545 Z', color: '#ead3a2' },
  { d: 'M 822 598 C 826 570, 824 548, 818 520 M 852 598 C 848 570, 850 548, 856 520',
    fill: 'M 822 598 C 826 570 824 548 818 520 L 856 520 C 850 548 848 570 852 598 Z', color: '#8f6548' },
  { d: bumpy(837, 425, 112, 96, 9, 1.28), color: '#76a95e' },
  { d: circle(1060, 140, 58), color: '#f5c04a' },
  { d: rays, fast: 1.6 },
  { d: bumpy(250, 140, 95, 34, 8, 1.45), color: '#ffffff' },
  { d: bumpy(690, 98, 70, 24, 7, 1.5), color: '#ffffff' },
  { d: 'M 560 222 Q 575 205 590 220 Q 605 205 620 222 M 640 196 Q 651 184 662 195 Q 673 184 684 196', fast: 1.2 },
  ...flower(120, 668, '#e86f8e'), ...flower(178, 692, '#f2b134'),
  ...flower(992, 662, '#b784d6'), ...flower(1048, 686, '#f07d5a'), ...flower(1112, 654, '#e86f8e'),
  { d: tufts, fast: 1.8 },
];

// Sample each subpath into wobbly hand-drawn points.
const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
svg.setAttribute('width', 0); svg.setAttribute('height', 0); svg.style.position = 'absolute';
const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
svg.appendChild(pathEl); document.body.appendChild(svg);
function sample(d) {
  pathEl.setAttribute('d', d);
  const L = pathEl.getTotalLength(), n = Math.max(2, Math.ceil(L / 2)), ph = rand() * 100, pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n * L, p = pathEl.getPointAtLength(s);
    pts.push({ x: p.x + .9 * Math.sin(s * .023 + ph) + .45 * Math.sin(s * .071 + ph * 1.7),
               y: p.y + .9 * Math.sin(s * .019 + ph * 2.3) + .45 * Math.sin(s * .067 + ph * .6) });
  }
  return { pts, len: L };
}
let totalLen = 0;
for (const it of ITEMS) {
  it.strokes = it.d.split(/(?=M)/).map(s => s.trim()).filter(Boolean).map(sample);
  it.strokes.forEach(s => totalLen += s.len / (it.fast || 1));
  if (it.color) it.path = new Path2D(it.fill || (it.closeFill ? it.d + ' L 1280 720 L 0 720 Z' : it.d));
}

// ---------- timeline ----------
const REST = { x: 1150, y: 640 }, LEAD = 1.0;
const SPEED = clamp(totalLen / 24, 300, 800);     // aim for ~24 s of pure drawing
const SEGS = [];
let T = LEAD, cur = { ...REST };
for (const it of ITEMS) {
  it.strokes.forEach((st, si) => {
    const a = st.pts[0], d = Math.hypot(a.x - cur.x, a.y - cur.y);
    const tr = si === 0 ? clamp(.18 + d / 1700, .3, .7) : clamp(.08 + d / 1800, .12, .4);
    SEGS.push({ type: 'travel', t0: T, t1: T + tr, a: { ...cur }, b: a }); T += tr;
    const dur = Math.max(.16, st.len / (SPEED * (it.fast || 1)));
    st.t0 = T; st.t1 = T + dur;
    SEGS.push({ type: 'draw', t0: T, t1: T + dur, st }); T += dur;
    cur = st.pts[st.pts.length - 1];
  });
  it.t1 = T;
}
const DRAW_END = T, LAST = { ...cur };

const BPM = 92, EIGHTH = 60 / BPM / 2, BAR = EIGHTH * 8;
const FIN_K = Math.ceil((DRAW_END + 1.0) / BAR) * 8, FIN = FIN_K * EIGHTH;
const CAP = { x: 74, y: 262, text: 'a quiet afternoon', dur: 2.3 };
const END = FIN + 6.5;
let capW = 380;

function tipOf(st, t) {
  const P = st.pts, N = P.length;
  if (t >= st.t1) return { n: N, tip: null, pos: P[N - 1] };
  const f = prog(clamp((t - st.t0) / (st.t1 - st.t0))) * (N - 1), n = Math.floor(f) + 1;
  if (n >= N) return { n: N, tip: null, pos: P[N - 1] };
  const a = P[n - 1], b = P[n], fr = f - (n - 1);
  const tip = { x: lerp(a.x, b.x, fr), y: lerp(a.y, b.y, fr) };
  return { n, tip, pos: tip };
}
function penAt(t) {
  if (t < SEGS[0].t0) return { ...REST, drawing: false, lift: 0, alpha: 1 };
  if (t < DRAW_END) {
    for (const s of SEGS) {
      if (t >= s.t1) continue;
      const u = clamp((t - s.t0) / (s.t1 - s.t0));
      if (s.type === 'travel') { const e = easeIO(u);
        return { x: lerp(s.a.x, s.b.x, e), y: lerp(s.a.y, s.b.y, e), drawing: false, lift: Math.sin(Math.PI * u), alpha: 1 }; }
      const p = tipOf(s.st, t).pos;
      return { x: p.x, y: p.y, drawing: true, lift: 0, alpha: 1 };
    }
  }
  const cs = { x: CAP.x, y: CAP.y - 16 };
  if (t < FIN) {
    const span = Math.min(1.1, FIN - DRAW_END), u = clamp((t - (FIN - span)) / span), e = easeIO(u);
    return { x: lerp(LAST.x, cs.x, e), y: lerp(LAST.y, cs.y, e), drawing: false, lift: Math.sin(Math.PI * u), alpha: 1 };
  }
  const u = (t - FIN) / CAP.dur;
  if (u < 1) return { x: CAP.x + capW * u, y: cs.y + 7 * Math.sin(u * 55), drawing: false, lift: 0, alpha: 1 };
  const v = clamp((t - FIN - CAP.dur) / 1.2);
  return { x: CAP.x + capW + 70 * v, y: cs.y - 60 * v, drawing: false, lift: v, alpha: 1 - v };
}

// ---------- piano (Web Audio) ----------
let AC, bus, recDest, wave, noiseBuf;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .005; comp.release.value = .25;
  const master = AC.createGain(); master.gain.value = .9;
  comp.connect(master); master.connect(AC.destination);
  if (AC.createMediaStreamDestination) { recDest = AC.createMediaStreamDestination(); master.connect(recDest); }
  bus = AC.createGain();
  const dry = AC.createGain(); dry.gain.value = .85; bus.connect(dry).connect(comp);
  const verb = AC.createConvolver(); verb.buffer = impulse(3);
  const wet = AC.createGain(); wet.gain.value = .32; bus.connect(verb).connect(wet).connect(comp);
  const amps = [0, 1, .42, .28, .17, .12, .075, .05, .035, .022, .015, .01, .007];
  wave = AC.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));
  noiseBuf = AC.createBuffer(1, AC.sampleRate * .06, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  AC.onstatechange = updateUI;
}
function impulse(sec) {
  const sr = AC.sampleRate, len = sr * sec, buf = AC.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * Math.min(1, i / (sr * .012)); }
  return buf;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function piano(midi, when, vel, hold, pan = 0) {
  const f = mtof(midi), out = run.out;
  const p = AC.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(out);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .4; lp.connect(p);
  const b0 = Math.min(18000, f * (4 + vel * 14));
  lp.frequency.setValueAtTime(b0, when);
  lp.frequency.setTargetAtTime(Math.min(b0, Math.max(700, f * 2.2)), when + .01, .25 + 120 / f);
  const env = AC.createGain(); env.connect(lp);
  const a = vel * vel * .5, decay = 2.6 * Math.pow(2, -(midi - 60) / 18);
  env.gain.setValueAtTime(0, when);
  env.gain.linearRampToValueAtTime(a, when + .004);
  env.gain.setTargetAtTime(a * .45, when + .004, .12);        // hammer transient falls away
  env.gain.setTargetAtTime(0, when + .2, decay);              // string decay
  env.gain.setTargetAtTime(0, when + hold, .18);              // damper
  const end = when + hold + 1.4;
  for (const det of [-1.3, 1.4]) {                            // two slightly detuned strings
    const o = AC.createOscillator(); o.setPeriodicWave(wave); o.frequency.value = f; o.detune.value = det;
    o.connect(env); o.start(when); o.stop(end);
  }
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(6000, f * 3); bp.Q.value = 1.2;
  const ng = AC.createGain(); ng.gain.setValueAtTime(vel * .05, when); ng.gain.exponentialRampToValueAtTime(.0001, when + .04);
  n.connect(bp).connect(ng).connect(p); n.start(when); n.stop(when + .06);
}

// ---------- music ----------
const CH = {
  F:  { root: 5, tones: [5, 9, 0, 4],  third: 4 },   // Fmaj7
  G:  { root: 7, tones: [7, 11, 2, 4], third: 4 },   // G6
  Em: { root: 4, tones: [4, 7, 11, 2], third: 3 },   // Em7
  Am: { root: 9, tones: [9, 0, 4, 7],  third: 3 },   // Am7
  G7: { root: 7, tones: [7, 11, 2, 5], third: 4 },   // cadence into the final C
};
const PROG = [CH.F, CH.G, CH.Em, CH.Am], PENTA = [0, 2, 4, 7, 9];
function nearest(target, pcs, lo = 60, hi = 88) {
  let best = lo, bd = 1e9;
  for (let m = lo; m <= hi; m++) { if (!pcs.includes(m % 12)) continue; const d = Math.abs(m - target); if (d < bd) { bd = d; best = m; } }
  return best;
}
function step(k, when) {
  if (k > FIN_K) return;
  if (k === FIN_K) {
    [36, 43, 48, 52, 55, 62, 64, 67, 72, 76, 79].forEach((m, i) => piano(m, when + i * .06, .62 - i * .02, 6, (i / 10 - .5) * .6));
    return;
  }
  const bar = k >> 3, pos = k & 7;
  const ch = bar === FIN_K / 8 - 1 ? CH.G7 : PROG[bar % 4];
  const br = 40 + ((ch.root - 4 + 12) % 12);
  const lh = { 0: [br, .5], 2: [br + 7, .32], 4: [br + 12, .36], 6: [br + 12 + ch.third, .3] }[pos];
  if (lh) piano(lh[0], when, lh[1], 1.9, -.25);
  if (pos === 0) ch.tones.forEach((pc, i) => piano(55 + ((pc - 7 + 12) % 12), when + .012 * i, .2, 2.3, .05));
  const tl = when - run.t0, ps = penAt(tl);
  if (!ps.drawing) return;
  // The melody follows the pencil: higher on the page = higher note.
  const target = 86 - (ps.y - 60) / 640 * 24 + 2.2 * Math.sin(ps.x / 47);
  const m = nearest(target, pos === 0 || pos === 4 ? ch.tones : PENTA);
  if (!((pos & 1) && m === run.lastMel)) {
    const vel = [.62, .38, .48, .38, .55, .38, .48, .4][pos] + (Math.random() - .5) * .08;
    piano(m, when, vel, .9, (ps.x / W * 2 - 1) * .55);
    run.glyphs.push({ t: tl, x: ps.x, y: ps.y, s: Math.random() });
  }
  run.lastMel = m;
}

let run = null;
function startRun() {
  initAudio();
  if (AC.state !== 'running') AC.resume();
  if (run) { const o = run.out; o.gain.setTargetAtTime(0, AC.currentTime, .04); setTimeout(() => o.disconnect(), 800); }
  const out = AC.createGain(); out.gain.value = .55; out.connect(bus);
  run = { t0: AC.currentTime + .15, out, k: 0, glyphs: [], lastMel: -1 };
}
setInterval(() => {
  if (!run || !AC) return;
  const horizon = AC.currentTime + .2;
  while (run.k <= FIN_K) {
    const when = run.t0 + run.k * EIGHTH;
    if (when > horizon) break;
    step(run.k, when); run.k++;
  }
}, 25);

// ---------- paper ----------
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const paper = makeCanvas(W * S, H * S);
{
  const p = paper.getContext('2d');
  p.fillStyle = '#f5eedf'; p.fillRect(0, 0, paper.width, paper.height);
  for (let i = 0; i < 40; i++) {
    const x = rand() * paper.width, y = rand() * paper.height, r = 80 + rand() * 260;
    const gr = p.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${rand() < .5 ? '215,198,165' : '255,252,240'},${.03 + rand() * .04})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = gr; p.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const vg = p.createRadialGradient(paper.width / 2, paper.height / 2, paper.height * .45, paper.width / 2, paper.height / 2, paper.width * .72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(120,90,50,.16)');
  p.fillStyle = vg; p.fillRect(0, 0, paper.width, paper.height);
}
const grain = makeCanvas(W * S, H * S);
{
  const p = grain.getContext('2d'), id = p.createImageData(grain.width, grain.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = 255 - Math.random() * 42; d[i] = v; d[i + 1] = v - 2; d[i + 2] = v - 6; d[i + 3] = 255; }
  p.putImageData(id, 0, 0);
}

// ---------- rendering ----------
const PASSES = [[0, 0, 2.3, .82], [.8, .5, 1.1, .35]];
function drawStroke(st, t) {
  if (t <= st.t0) return;
  const { n, tip } = tipOf(st, t), P = st.pts;
  for (const [ox, oy, w, al] of PASSES) {
    g.globalAlpha = al; g.lineWidth = w;
    g.beginPath(); g.moveTo(P[0].x + ox, P[0].y + oy);
    for (let i = 1; i < n; i++) g.lineTo(P[i].x + ox, P[i].y + oy);
    if (tip) g.lineTo(tip.x + ox, tip.y + oy);
    g.stroke();
  }
}
function drawPencil(x, y, lift, alpha) {
  if (alpha <= 0) return;
  const A = -.82, s = .85 * (1 + .07 * lift);
  g.save(); g.globalAlpha = alpha;
  g.save(); g.translate(x + 6 + 22 * lift, y + 5 + 16 * lift); g.rotate(A); g.scale(.85, .85);
  g.fillStyle = 'rgba(50,35,20,.16)';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(26, -9); g.lineTo(208, -9); g.lineTo(208, 9); g.lineTo(26, 9); g.closePath(); g.fill();
  g.restore();
  g.translate(x, y); g.rotate(A); g.scale(s, s);
  g.fillStyle = '#e9cda4'; g.beginPath(); g.moveTo(0, 0); g.lineTo(26, -9); g.lineTo(26, 9); g.closePath(); g.fill();
  g.fillStyle = '#34302c'; g.beginPath(); g.moveTo(-.5, 0); g.lineTo(9, -3.2); g.lineTo(9, 3.2); g.closePath(); g.fill();
  g.fillStyle = '#f2c230'; g.fillRect(26, -9, 146, 18);
  g.fillStyle = '#fbd955'; g.fillRect(26, -9, 146, 5);
  g.fillStyle = '#d6a511'; g.fillRect(26, 4, 146, 5);
  g.strokeStyle = 'rgba(60,40,20,.35)'; g.lineWidth = .8; g.strokeRect(26, -9, 146, 18);
  g.fillStyle = '#bfc3c7'; g.fillRect(172, -9.5, 18, 19);
  g.fillStyle = '#9aa0a6'; g.fillRect(177, -9.5, 2, 19); g.fillRect(183, -9.5, 2, 19);
  g.fillStyle = '#ec8f8a'; g.beginPath(); g.moveTo(190, -9); g.lineTo(203, -9); g.quadraticCurveTo(208, -9, 208, -4);
  g.lineTo(208, 4); g.quadraticCurveTo(208, 9, 203, 9); g.lineTo(190, 9); g.closePath(); g.fill();
  g.restore();
}

const ui = {
  overlay: document.getElementById('overlay'), play: document.getElementById('play'),
  restart: document.getElementById('restart'), rec: document.getElementById('rec'),
  save: document.getElementById('save'), status: document.getElementById('status'),
  progress: document.getElementById('progress'),
};
const now = () => run ? Math.max(0, AC.currentTime - run.t0) : 0;
const ended = () => run && now() > FIN + 4.5;

function render() {
  requestAnimationFrame(render);
  const t = now();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.drawImage(paper, 0, 0);
  g.setTransform(S, 0, 0, S, 0, 0);

  if (run) {
    // Finale: sky wash + warm sun glow
    const sky = smooth(clamp((t - FIN) / 2.5));
    if (sky > 0) {
      g.globalAlpha = sky; g.globalCompositeOperation = 'multiply';
      const sg = g.createLinearGradient(0, 0, 0, 520);
      sg.addColorStop(0, '#a9d0ec'); sg.addColorStop(.6, '#e6eef0'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sg; g.fillRect(0, 0, W, 520);
      g.globalCompositeOperation = 'source-over';
      const gl = g.createRadialGradient(1060, 140, 0, 1060, 140, 420);
      gl.addColorStop(0, 'rgba(255,205,100,.35)'); gl.addColorStop(1, 'rgba(255,205,100,0)');
      g.fillStyle = gl; g.fillRect(0, 0, W, H);
    }
    g.lineJoin = 'round'; g.lineCap = 'round'; g.strokeStyle = '#2f2a26';
    for (const it of ITEMS) {
      if (it.path) {
        const a = smooth(clamp((t - it.t1 + .1) / 1.3)) * .92;
        if (a > 0) {
          g.fillStyle = it.color;
          g.globalAlpha = a; g.fill(it.path);
          g.globalAlpha = a * .18; g.save(); g.translate(1.6, 1.2); g.fill(it.path); g.restore();
        }
      }
      for (const st of it.strokes) drawStroke(st, t);
    }
    // Handwritten caption
    if (t > FIN) {
      g.globalAlpha = 1; g.fillStyle = '#2f2a26'; g.font = `700 56px Caveat, cursive`;
      capW = g.measureText(CAP.text).width;
      const u = clamp((t - FIN) / CAP.dur);
      g.save(); g.beginPath(); g.rect(CAP.x - 10, CAP.y - 80, 10 + capW * u, 120); g.clip();
      g.fillText(CAP.text, CAP.x, CAP.y); g.restore();
      const sa = clamp((t - FIN - CAP.dur) / 1.2);
      if (sa > 0) { g.globalAlpha = sa * .6; g.font = `500 26px Caveat, cursive`; g.fillText('drawn with code & piano', CAP.x + 4, CAP.y + 36); }
    }
  }

  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = .38; g.globalCompositeOperation = 'multiply';
  g.drawImage(grain, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.setTransform(S, 0, 0, S, 0, 0);

  if (run) {
    g.font = '22px Georgia, serif'; g.fillStyle = '#3a332c';
    run.glyphs = run.glyphs.filter(q => t - q.t < 1.8);
    for (const q of run.glyphs) {
      const age = t - q.t; if (age < 0) continue;
      g.globalAlpha = (1 - age / 1.8) * .5 * Math.min(1, age * 8);
      g.fillText('♪♫♩'[Math.floor(q.s * 3)], q.x - 20 - age * 10 - q.s * 8, q.y - 18 - age * 36);
    }
  }
  const pen = penAt(t);
  drawPencil(pen.x, pen.y, pen.lift, pen.alpha);
  g.globalAlpha = 1;

  ui.progress.style.width = (run ? clamp(t / END) * 100 : 0) + '%';
  if (recorder && recorder.state === 'recording' && t >= END) recorder.stop();
  updateUI();
}

// ---------- controls & recording ----------
let recorder = null, lastUI = '';
function updateUI() {
  const recording = recorder && recorder.state === 'recording';
  const label = !run ? '▶ Play' : ended() ? '↺ Replay' : AC.state === 'running' ? '❚❚ Pause' : '▶ Resume';
  const status = recording ? 'Recording… keep this tab visible' : ui.save.hidden ? 'Space = play / pause' : 'Video ready';
  const key = label + status + recording;
  if (key === lastUI) return; lastUI = key;
  ui.play.textContent = label; ui.play.disabled = recording && !ended();
  ui.status.textContent = status;
  ui.rec.classList.toggle('recording', !!recording);
  ui.rec.lastChild.textContent = recording ? ' Recording…' : ' Record video';
}
function begin(record) {
  if (recorder && recorder.state === 'recording') { recorder.onstop = null; recorder.stop(); }
  ui.overlay.classList.add('hidden');
  startRun();
  if (record) startRecording();
  updateUI();
}
function startRecording() {
  if (!window.MediaRecorder || !cv.captureStream || !recDest) { ui.status.textContent = 'Recording is not supported in this browser'; return; }
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4;codecs=avc1,mp4a', 'video/mp4']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || 'video/webm';
    if (ui.save.href) URL.revokeObjectURL(ui.save.href);
    ui.save.href = URL.createObjectURL(new Blob(chunks, { type }));
    ui.save.download = 'pencil-sonata.' + (type.includes('mp4') ? 'mp4' : 'webm');
    ui.save.hidden = false; lastUI = ''; updateUI();
  };
  ui.save.hidden = true;
  recorder.start(250);
}
ui.overlay.onclick = () => begin(false);
ui.restart.onclick = () => begin(false);
ui.rec.onclick = () => begin(true);
ui.play.onclick = () => {
  if (!run || ended()) return begin(false);
  AC.state === 'running' ? AC.suspend() : AC.resume();
};
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); ui.play.click(); } });

document.fonts && document.fonts.load('700 56px Caveat');
render();
</script>
</body>
</html>
